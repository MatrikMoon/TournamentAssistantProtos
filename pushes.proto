syntax = "proto3";
package proto.packets;

option csharp_namespace = "TournamentAssistantShared.Models.Packets";

import "models.proto";

// ---- Pushes (SUBMIT something!) ---- //
message Push {
  message SongFinished {
    enum CompletionType {
      Passed = 0;
      Failed = 1;
      Quit = 2;
    }

    models.User player = 1;
    models.Beatmap beatmap = 2;
    CompletionType type = 3;
    int32 score = 4;
    int32 misses = 5;
    int32 bad_cuts = 6;
    int32 good_cuts = 7;
    float end_time = 8;
    string tournament_id = 9;
    string match_id = 10;
    int32 max_score = 11;
    double accuracy = 12;
  }

  message QualifierScoreSubmitted {
    string tournament_id = 1;
    models.QualifierEvent event = 2;
    models.GameplayParameters map = 3;
    models.LeaderboardEntry qualifier_score = 4;
  }

  // Sent when a player submits a replay. When the server could not store it the replay itself is in data, so listeners still get it once
  message ReplaySubmitted {
    string tournament_id = 1;
    models.ReplayRecording replay = 2;
    bool stored = 3;
    bytes data = 4;
  }

  oneof data {
    models.RealtimeScore realtime_score = 1;
    SongFinished song_finished = 2;
    QualifierScoreSubmitted qualifier_score_submtited = 3;
    ReplaySubmitted replay_submitted = 4;
  }
}